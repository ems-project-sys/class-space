services:
  - type: web
    name: classpace-backend
    runtime: node
    plan: free
    rootDir: classpace-backend
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: classpace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: classpace-frontend
    runtime: static
    rootDir: classpace-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: classpace-db
    plan: free
    databaseName: classspace
    user: classpace_app
