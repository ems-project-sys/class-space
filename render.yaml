services:
  - type: web
    name: classpace-backend
    runtime: node
    plan: free
    rootDir: classpace-backend
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npx prisma db execute --file prisma/seed.sql && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: classpace-frontend
    runtime: static
    rootDir: classpace-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
